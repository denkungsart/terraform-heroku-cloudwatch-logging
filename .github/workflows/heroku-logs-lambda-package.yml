name: Heroku Logs Lambda Package

on:
  pull_request:
    paths:
      - ".github/workflows/heroku-logs-lambda-package.yml"
      - "**.tf"
      - "scripts/check-heroku-logs-lambda-package.sh"
      - "support/lambda_heroku/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/heroku-logs-lambda-package.yml"
      - "**.tf"
      - "scripts/check-heroku-logs-lambda-package.sh"
      - "support/lambda_heroku/**"

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Heroku Logs Lambda
        working-directory: support/lambda_heroku
        run: |
          npm ci
          npm test

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.1"

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Validate Observability Link Submodule
        working-directory: modules/observability-link
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Heroku Logs Lambda Package
        run: ./scripts/check-heroku-logs-lambda-package.sh
